# Amazon（セラーセントラル）の計算書（支払明細）のプロファイル。
# 計算書は振込1本の内訳書。全行を売上行/費用行/振込行に分類し、
# 1計算書を1枚の複合伝票（借方: 入金先預金+費用各行 / 買方: 売上高）にする。
# 費用行の科目は学習ルール（明細取込の「学習ルール」）で決める。
# このファイルの名前（name）は、計算書の通帳に付けた名前と一致させる
name: Amazon
type: settlement

# テキスト層のあるPDF（支払明細書）の決定的解析。この語がすべてテキストに
# 含まれるとき、このプロファイルの書式として解析する（detectのない
# settlementプロファイルはテキスト解析を行わず、AI読取の分類だけに使う）
detect:
  - 支払明細書
  - 純利益

# テキスト解析の約束（省略時の既定値は libs/bank-statement.js を参照）
aggregateSale: '^売上\s*[\u00a5￥]'
aggregateExpense: '^支出\s*[\u00a5￥-]'
# 振込予定文（2025/8/12に、末尾が(545)の銀行口座へ￥111,718の振込みが…）
# ※ YAMLの単一引用符内では \ はエスケープ不要（\\ と書くと正規表現に
#   リテラルの \ が渡って壊れる）
transferDatePattern: '(\d{4})/(\d{1,2})/(\d{1,2})に、.*?口座へ'
# 振込IDの行（伝票摘要の備考になる）
memoPattern: '^銀行振込ID'

# 売上行の分類: salePatternを省略すると「振込行以外の入力行はすべて売上」と
# なり、AI読取のラベルの揺れに強い。明示する場合は '^売上' のように書く
# salePattern: '^売上'
# 振込行（純利益の振込み。AI読取の揺れで「純利益」だけに切れることがある）
transferPattern: '振込|純利益'

# 買方の売上高（補助1=Amazon）
saleAccount: 6000000
saleSubAccount: 1

# 借方の入金先預金（住信SBI。普通預金1010010 補助1）
receivedAccount: 1010010
receivedSubAccount: 1
